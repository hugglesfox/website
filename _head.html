<head>
	{{#title}}
		<title>{{title}} | {{SITE_TITLE}}</title>
	{{/title}}
	{{^title}}
		<title>{{SITE_TITLE}}</title>
	{{/title}}

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="author" content="{{SITE_AUTHOR}}">
	<meta name="description" content="{{SITE_TITLE}}">
	<meta name="fediverse:creator" content="@huggles@furry.engineer">

	<meta property="og:title" content="{{title}}">
	<meta property="og:type" content="website">
	<meta property="og:url" content="{{SITE_URL}}/{{slug}}">
	<meta property="og:image" content="{{SITE_URL}}/huggles.png">

	<link rel="alternate" type="application/rss+xml" title="RSS Feed for {{SITE_TITLE}}" href="/feed.xml">
	<link rel="stylesheet" href="/css/style.css">

	<link rel="stylesheet" href="/fonts/fontawesome-free-7.0.0-web/css/fontawesome.css">
	<link rel="stylesheet" href="/fonts/fontawesome-free-7.0.0-web/css/brands.css">

	<link rel="stylesheet" href="/fonts/ibm-plex-mono/css/ibm-plex-mono-default.css">
	<link rel="stylesheet" href="/fonts/ibm-plex-serif/css/ibm-plex-serif-default.css">

	<link rel="stylesheet" href="/js/highlightjs-11.11.1/styles/base16/dracula.css">
</head>
