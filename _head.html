<head>
	{{#title}}
		<title>{{title}} | {{SITE_TITLE}}</title>
		<meta property="og:title" content="{{title}}">
		<meta property="og:description" content="{{SITE_TITLE}}">
	{{/title}}
	{{^title}}
		<title>{{SITE_TITLE}}</title>
		<meta property="og:title" content="{{SITE_TITLE}}">
		<meta property="og:description" content="Welcome! Here I share projects and things that I discover.">
	{{/title}}

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="author" content="{{SITE_AUTHOR}}">
	<meta name="description" content="{{SITE_TITLE}}">
	<meta name="fediverse:creator" content="@huggles@furry.engineer">

	<meta property="og:type" content="website">
	<meta property="og:url" content="{{SITE_URL}}/{{slug}}">
	<meta property="og:image" content="{{SITE_URL}}/huggles.png">

	<link rel="alternate" type="application/rss+xml" title="RSS Feed for {{SITE_TITLE}}" href="/feed.xml">
	<link rel="stylesheet" href="/css/style.css">

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/base16/dracula.min.css" integrity="sha512-zKpFlhUX8c+WC6H/XTJavnEpWFt2zH9BU9vu0Hry5Y+SEgG21pRMFcecS7DgDXIegXBQ3uK9puwWPP3h6WSR9g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
